<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pirat Dawid">
<meta name="theme-color" content="#5a3417">
<title>Piracka wyprawa Dawida</title>
<style>
:root{--sea1:#0b4f7a;--sea2:#1e88b8;--sand:#f4d58d;--ink:#2b1d0e;--ok:#2e9e4f;--bad:#d64545;--gold:#f5b700;--card:#fff8e7;--s0:#1565c0;--s1:#c62828}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(#0b4f7a,#1e88b8);font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:#5a3417;color:#fff3d6;box-shadow:0 3px 0 #3b210d;flex-wrap:wrap}
header .ttl{font-weight:800;font-size:20px;flex:1;white-space:nowrap}
.pill{background:#3b210d;border-radius:20px;padding:6px 12px;font-weight:800;font-size:18px}
.hb{border:0;background:var(--gold);color:#3b210d;border-radius:12px;font-size:18px;padding:7px 12px;font-weight:800;font-family:inherit}
main{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center;-webkit-overflow-scrolling:touch}
.stage{width:100%;max-width:920px;display:flex;flex-direction:column;align-items:center;gap:14px}
.steps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.steps span{background:rgba(255,255,255,.22);color:#fff;border-radius:14px;padding:5px 10px;font-size:15px;font-weight:800}
.steps span.on{background:var(--gold);color:#3b210d}
.steps span.dn{background:rgba(46,158,79,.9)}
.sub{color:#fff;font-size:clamp(20px,3vw,26px);font-weight:800;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.cnt{font-size:16px;background:rgba(0,0,0,.25);border-radius:10px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.card{background:var(--card);border-radius:24px;padding:22px;width:100%;box-shadow:0 8px 0 rgba(0,0,0,.2);border:4px solid #e8c77a;text-align:center}
.card.read{min-height:220px;display:flex;align-items:center;justify-content:center;transition:border-color .2s,box-shadow .2s}
.card.lit{border-color:var(--ok);box-shadow:0 0 0 6px rgba(46,158,79,.35),0 8px 0 rgba(0,0,0,.2)}
.big{font-size:clamp(56px,11vw,124px);font-weight:800;line-height:1.2}
.big.mid{font-size:clamp(40px,7vw,84px)}
.big.sm{font-size:clamp(30px,4.8vw,56px)}
.s0{color:var(--s0)}.s1{color:var(--s1)}
.dot{color:#cdb88c;font-weight:400}
.w{white-space:nowrap;display:inline-block}
.tbar{width:100%;height:20px;background:rgba(255,255,255,.3);border-radius:10px;overflow:hidden}
.tbar div{height:100%;width:100%;background:linear-gradient(90deg,#f5b700,#ff7a00)}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.b{border:0;border-radius:18px;padding:16px 22px;font-size:clamp(18px,2.4vw,22px);font-weight:800;background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.25);font-family:inherit;cursor:pointer;touch-action:manipulation}
.b:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.b.go{background:var(--gold);font-size:clamp(22px,3vw,28px);padding:18px 34px}
.b.ok{background:var(--ok);color:#fff}
.b.warn{background:#ffb27a}
.b.sm{padding:8px 14px;font-size:16px}
.pic{font-size:clamp(90px,16vw,150px);line-height:1.15}
.snd{margin-top:6px;font-size:22px}
.snd b{background:var(--s1);color:#fff;border-radius:10px;padding:2px 12px;font-size:28px}
.tip{margin-top:12px;background:#fff1c9;border-radius:14px;padding:12px 14px;font-size:clamp(17px,2.3vw,21px);text-align:left;line-height:1.4}
.qtext{font-size:clamp(28px,4.6vw,46px);font-weight:800;line-height:1.25}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.opt{font-size:clamp(22px,3.6vw,36px);padding:20px 10px}
.opt.good{background:var(--ok);color:#fff}
.opt.bad{background:var(--bad);color:#fff}
.stars{font-size:34px;letter-spacing:4px}
.mapwrap{width:100%;max-width:1150px}
svg.map{width:100%;height:auto;display:block;border-radius:20px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.isl{cursor:pointer}.isl.lock{opacity:.55;cursor:default}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.ship{animation:bob 1.6s ease-in-out infinite;transform-box:fill-box}
.gwrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.ghud{display:flex;gap:16px;align-items:center;color:#fff;font-size:22px;font-weight:800}
.garea{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.garea canvas{width:min(100%,calc((100dvh - 250px)*16/9));aspect-ratio:16/9;border-radius:16px;box-shadow:0 6px 0 rgba(0,0,0,.25);touch-action:none;background:#87ceeb}
.ctl{display:flex;gap:14px;width:min(100%,920px)}
.ctl button{font-size:34px;border:0;border-radius:20px;padding:14px 32px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);font-weight:800;touch-action:none;font-family:inherit;color:var(--ink)}
.ctl .jb{background:var(--gold);margin-left:auto;padding:14px 44px}
.ctl button.on{transform:translateY(3px);box-shadow:none}
.pz{display:grid;gap:3px;width:min(92vw,calc(100dvh - 240px));max-width:620px;background:#5a3417;padding:6px;border-radius:12px}
.pt{aspect-ratio:1;border-radius:4px;cursor:pointer;border:3px solid transparent;background-repeat:no-repeat}
.pt.sel{border-color:var(--gold);transform:scale(.93)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(100%,860px)}
.mc{aspect-ratio:4/3;border-radius:16px;border:0;font-size:clamp(20px,3.3vw,34px);font-weight:800;background:#7a4a24;color:#ffe9a8;box-shadow:0 5px 0 rgba(0,0,0,.3);font-family:inherit;display:flex;align-items:center;justify-content:center;padding:4px;touch-action:manipulation}
.mc.open{background:var(--card);color:var(--ink)}
.mc.pe{font-size:clamp(40px,7vw,66px)}
.mc.done{background:#c9f2d3;opacity:.8}
.parch{background:#fbecc4;border-color:#c9a25a}
.story{font-size:clamp(21px,2.9vw,29px);line-height:1.5;text-align:left}
.ttlbig{font-size:clamp(34px,6vw,62px);font-weight:900;color:#fff;text-align:center;text-shadow:0 4px 0 #3b210d;line-height:1.1}
.warnbox{background:#ffe0b2;border-radius:12px;padding:10px;font-size:16px;text-align:left}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.hidden{display:none!important}
.mbox{background:var(--card);border-radius:20px;padding:20px;max-width:580px;width:100%;max-height:90vh;overflow:auto;-webkit-user-select:text;user-select:text}
.mbox h2{margin:0 0 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0;font-size:18px}
.note{font-size:14px;color:#6b5a40}
select,input{font-size:18px;padding:6px 8px;border-radius:10px;border:2px solid #c9a25a;font-family:inherit;background:#fff}
input[type=text]{width:180px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
.chest{position:relative;width:240px;height:210px;margin:70px auto 0}
.chest .box{position:absolute;bottom:0;left:0;width:240px;height:120px;background:#8b5a2b;border:8px solid #5a3417;border-radius:10px;z-index:2}
.chest .box:after{content:"";position:absolute;left:0;right:0;top:40px;height:14px;background:#5a3417}
.chest .lid{position:absolute;bottom:112px;left:0;width:240px;height:80px;background:#a0692f;border:8px solid #5a3417;border-radius:70px 70px 8px 8px;transform-origin:left bottom;transition:transform .8s cubic-bezier(.3,1.6,.5,1);z-index:3}
.chest .lock{position:absolute;left:100px;bottom:88px;width:40px;height:46px;background:var(--gold);border:4px solid #5a3417;border-radius:8px;z-index:4;transition:opacity .3s}
.chest .loot{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-size:52px;opacity:0;transition:all .9s .3s;z-index:1}
.chest.open .lid{transform:rotate(-38deg)}
.chest.open .lock{opacity:0}
.chest.open .loot{opacity:1;transform:translateY(-70px)}
.reward{font-size:clamp(34px,6vw,62px);font-weight:900;color:#b8860b;margin:8px 0}
.res{font-size:clamp(26px,4vw,40px);font-weight:900}
</style>
</head>

</div>
<div id="modal" class="hidden"></div>

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,vol,when){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;const t=a.currentTime+(when||0);g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);}

let voice=null;
const hasTTS='speechSynthesis' in window;
function pickVoice(){if(!hasTTS)return;const vs=speechSynthesis.getVoices();const pl=vs.filter(v=>(v.lang||'').toLowerCase().replace('_','-').indexOf('pl')===0);voice=pl.find(v=>/premium|enhanced|zosia/i.test(v.name))||pl[0]||null;}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(text,rate){
 return new Promise(res=>{
  if(!hasTTS||!text)return res();
  let fin=false;const done=()=>{if(!fin){fin=true;res();}};
  try{speechSynthesis.cancel();}catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  u.lang='pl-PL';if(voice)u.voice=voice;u.rate=rate||S.set.rate;u.pitch=1.05;
  u.onend=done;u.onerror=done;
  try{speechSynthesis.speak(u);}catch(e){done();}
  setTimeout(done,2500+text.length*140/u.rate);
 });
}
function stopSay(){if(hasTTS){try{speechSynthesis.cancel();}catch(e){}}}

function readingItems(L){

 else if(lv.t===4){focus=gs.flatMap(g=>g.w.map(w=>w[0]));fill=W3.concat(allWords().map(w=>w[0]).filter(w=>sylCount(w)>=3));}
 else{focus=shuffle(PH).slice(0,Math.ceil(N/2)).concat(gs.flatMap(g=>g.w.map(w=>w[0])).filter(w=>sylCount(w)>=2));fill=W3;}

 return shuffle(list);
}

function stageReading(L,next){
 clearAll();
 const items=readingItems(L),total=items.length;let queue=items.slice(),doneN=0;const tries={};
 function show(){
  timers.forEach(clearTimeout);timers=[];
  if(!queue.length)return next();
  const it=queue[0];let revealed=false;
  const base=+S.set.timer,wc=wordCount(it),sc=sylCount(it);
  const secs=base===0?0:base*Math.max(1,wc)*(wc===1&&sc>=3?1.5:1);
  const cls=it.length>22?'sm':it.length>9?'mid':'';
  screen.innerHTML='<div class="stage">'+stepsBar(0)+'<div class="sub">📖 Przeczytaj na głos – sylabami! <span class="cnt">'+(doneN+1)+'/'+total+'</span></div>'+
  '<div class="card read" id="rc"><div class="big '+cls+'">'+sylHTML(it)+'</div></div>'+
  (secs?'<div class="tbar" id="tw"><div id="tb"></div></div>':'')+
  '<div class="btns" id="bt"><button class="b go" id="rd">Przeczytałem! 👍</button></div></div>';
  const reveal=()=>{
   if(revealed)return;revealed=true;timers.forEach(clearTimeout);timers=[];
   $('#rc').classList.add('lit');const tw=$('#tw');if(tw)tw.style.visibility='hidden';
   $('#bt').innerHTML='<button class="b" id="ag">🔊 Jeszcze raz</button><button class="b" id="sl">🐢 Sylabami</button><button class="b warn" id="rp">🔁 Poćwiczę</button><button class="b ok" id="gd">✅ Dobrze!</button>';
   $('#ag').onclick=()=>sayItem(it);
   $('#sl').onclick=()=>sayItem(it,true);
   $('#gd').onclick=()=>{addCoins(1);sfx.coin();queue.shift();doneN++;show();};
   $('#rp').onclick=()=>{tries[it]=(tries[it]||0)+1;const x=queue.shift();if(tries[it]<3)queue.push(x);else doneN++;show();};
   sayItem(it,S.set.slow&&sc>1);
  };
  $('#rd').onclick=reveal;
  if(secs){const tb=$('#tb');tb.style.transition='none';tb.style.width='100%';
   requestAnimationFrame(()=>requestAnimationFrame(()=>{tb.style.transition='width '+secs+'s linear';tb.style.width='0%';}));
   later(()=>{sfx.bad();reveal();},secs*1000);}
 }
 show();
}

 const lv=LEVELS[L];const per=lv.g.map(k=>shuffle(G[k].w.map(w=>[w[0],w[1],k])));const ws=[];
 while(ws.length<5){let add=false;per.forEach(p=>{if(p.length&&ws.length<5){ws.push(p.shift());add=true;}});if(!add)break;}
 let i=0;
 function card(){
  timers.forEach(clearTimeout);timers=[];

 let order=[...Array(n*n).keys()];do{order=shuffle(order);}while(order.every((v,i)=>v===i));
 let sel=-1,moves=0,fin=false;
 function render(){wrap.innerHTML='';order.forEach((p,i)=>{const d=document.createElement('div');d.className='pt'+(i===sel?' sel':'');const r=Math.floor(p/n),cc=p%n;d.style.backgroundImage='url('+img+')';d.style.backgroundSize=(n*100)+'% '+(n*100)+'%';d.style.backgroundPosition=(cc*100/(n-1))+'% '+(r*100/(n-1))+'%';d.onclick=()=>tap(i);wrap.appendChild(d);});}
 function tap(i){if(fin)return;if(sel<0)sel=i;else if(sel===i)sel=-1;else{[order[sel],order[i]]=[order[i],order[sel]];sel=-1;moves++;tone(520,.08,'triangle',.08);
   if(order.every((v,k)=>v===k)){fin=true;render();wrap.style.gap='0';const sc=Math.max(5,(n===3?20:32)-moves);hud.score(sc);later(()=>end(sc),1500);return;}}
  render();}
 render();hud.time(null);
 return{stop(){},score:()=>fin?Math.max(5,20-moves):3};
};

/* --- memory --- */
GAMEFN.memory=function(area,L,hud,end){
 const ws=shuffle(levelWords(L)).slice(0,6);
 let cards=[];ws.forEach((w,i)=>{cards.push({id:i,k:'p',w:w[0],e:w[1]});cards.push({id:i,k:'w',w:w[0],e:w[1]});});cards=shuffle(cards);
 const grid=document.createElement('div');grid.className='mem';area.appendChild(grid);
 let open=[],lock=false,pairs=0,score=0,flips=0;
 cards.forEach((cd,i)=>{const b=document.createElement('button');b.className='mc';b.textContent='🏴‍☠️';cd.el=b;
  b.onclick=()=>{if(lock||cd.done||open.includes(cd))return;flips++;b.classList.add('open');if(cd.k==='p'){b.classList.add('pe');b.textContent=cd.e;}else b.innerHTML=sylHTML(cd.w);tone(600,.06,'triangle',.06);open.push(cd);
   if(open.length===2){const [a,bb]=open;
    if(a.id===bb.id){a.done=bb.done=true;pairs++;score+=2;hud.score(score);sfx.ok();sayItem(a.w);setTimeout(()=>{a.el.classList.add('done');bb.el.classList.add('done');},300);open=[];
     if(pairs===ws.length)later(()=>end(score+Math.max(0,10-Math.floor((flips-12)/2))),1600);}
    else{lock=true;later(()=>{[a,bb].forEach(x=>{x.el.className='mc';x.el.textContent='🏴‍☠️';});open=[];lock=false;},1100);}
   }};
  grid.appendChild(b);});
 hud.time(null);
 return{stop(){},score:()=>score};
};

/* --- cannon --- */
GAMEFN.cannon=function(area,L,hud,end){
 const [cv,c]=mkCanvas(area);const CX=480,CY=505,SEA=320;
 let ang=-Math.PI/2,cd=0,time=45,score=0,spawn=.3,tt=0,over=false;const balls=[],tg=[],fx=[];
 const down=e=>{e.preventDefault();ac();const p=cpt(cv,e);ang=Math.max(-Math.PI+.12,Math.min(-.12,Math.atan2(p.y-CY,p.x-CX)));
  if(cd<=0&&!over){balls.push({x:CX+Math.cos(ang)*70,y:CY+Math.sin(ang)*70,vx:Math.cos(ang)*900,vy:Math.sin(ang)*900});cd=.3;tone(160,.15,'square',.07);fx.push({x:CX+Math.cos(ang)*82,y:CY+Math.sin(ang)*82,t:.3,m:.3,k:'smoke'});}};
 cv.addEventListener('pointerdown',down);
 function addT(){const r=Math.random(),dir=Math.random()<.5?1:-1,sp=60+L*5+Math.random()*60;
  if(r<.33)tg.push({k:'ship',x:dir>0?-90:1050,y:SEA+48,r:44,v:sp*dir*.6,p:3,ph:0});
  else if(r<.68)tg.push({k:'barrel',x:dir>0?-40:1000,y:SEA+ri(95,140),r:26,v:sp*dir,p:1,ph:Math.random()*6});
  else tg.push({k:'balloon',x:dir>0?-40:1000,y:ri(70,230),r:26,v:sp*dir*1.25,p:2,ph:Math.random()*6});}
 function draw(){
  sky(c,SEA);seaDraw(c,SEA,tt);
  tg.forEach(o=>{const y=o.yy;
   if(o.k==='ship'){c.save();c.translate(o.x,y);if(o.v<0)c.scale(-1,1);c.fillStyle='#6d3f1d';c.beginPath();c.moveTo(-55,0);c.lineTo(55,0);c.lineTo(40,26);c.lineTo(-40,26);c.closePath();c.fill();c.fillStyle='#4a2a12';c.fillRect(-3,-70,6,70);c.fillStyle='#222';c.beginPath();c.moveTo(3,-66);c.lineTo(46,-34);c.lineTo(3,-8);c.fill();c.restore();emo(c,'🐀',o.x+(o.v<0?-20:20),y-36,26);}
   else emo(c,o.k==='barrel'?'🛢️':'🎈',o.x,y,o.k==='barrel'?46:50);});
  balls.forEach(b=>{c.fillStyle='#222';c.beginPath();c.arc(b.x,b.y,9,0,7);c.fill();});
  fx.forEach(f=>{const a=f.t/f.m;if(f.k==='smoke'){c.fillStyle='rgba(200,200,200,'+a+')';c.beginPath();c.arc(f.x,f.y,22*(1.6-a),0,7);c.fill();}
   else{c.fillStyle='rgba(255,140,0,'+a+')';c.beginPath();c.arc(f.x,f.y,55*(1.2-a),0,7);c.fill();c.fillStyle='rgba(255,230,0,'+a+')';c.beginPath();c.arc(f.x,f.y,30*(1.2-a),0,7);c.fill();c.fillStyle='rgba(43,29,14,'+a+')';c.font='bold 34px sans-serif';c.textAlign='center';c.fillText('+'+f.p,f.x,f.y-50*(1-a)-20);}});
  c.save();c.translate(CX,CY);c.rotate(ang);c.fillStyle='#333';c.fillRect(0,-15,80,30);c.fillStyle='#555';c.fillRect(70,-18,12,36);c.restore();
  c.fillStyle='#6d3f1d';c.fillRect(CX-60,CY+5,120,40);c.fillStyle='#222';c.beginPath();c.arc(CX,CY,28,0,7);c.fill();c.fillStyle='#8b5a2b';c.beginPath();c.arc(CX-40,CY+38,16,0,7);c.arc(CX+40,CY+38,16,0,7);c.fill();
 }
 const stopL=loop(dt=>{
  tt+=dt;cd-=dt;
  if(!over){time-=dt;spawn-=dt;if(spawn<=0){addT();spawn=Math.max(.55,1.15-L*.03);}}
  balls.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;});
  tg.forEach(o=>{o.x+=o.v*dt;o.yy=o.k==='balloon'?o.y+Math.sin(tt*3+o.ph)*25:o.k==='barrel'?o.y+Math.sin(tt*2+o.ph)*5:o.y+Math.sin(tt*1.5)*3;});
  for(const b of balls)for(const o of tg){if(!o.hit&&!b.dead&&Math.hypot(b.x-o.x,b.y-(o.k==='ship'?o.yy-20:o.yy))<o.r+10){o.hit=true;b.dead=true;score+=o.p;hud.score(score);sfx.boom();fx.push({x:o.x,y:o.yy,t:.7,m:.7,k:'boom',p:o.p});}}
  for(let i=balls.length-1;i>=0;i--){const b=balls[i];if(b.dead||b.x<-20||b.x>980||b.y<-20)balls.splice(i,1);}
  for(let i=tg.length-1;i>=0;i--){const o=tg[i];if(o.hit||o.x<-120||o.x>1080)tg.splice(i,1);}
  for(let i=fx.length-1;i>=0;i--){fx[i].t-=dt;if(fx[i].t<=0)fx.splice(i,1);}
  hud.time(time);
  if(time<=0&&!over){over=true;later(()=>end(score),600);}
  draw();
 });
 return{stop(){stopL();cv.removeEventListener('pointerdown',down);},score:()=>score};
};

/* --- catch --- */
GAMEFN.catch=function(area,L,hud,end){
 const [cv,c]=mkCanvas(area);const WL=455;
 let bx=480,tx=480,score=0,time=40,sp=.4,stun=0,tt=0,over=false,kl=false,kr=false;const items=[],fx=[];
 const mv=e=>{const p=cpt(cv,e);tx=p.x;};const dn=e=>{e.preventDefault();ac();mv(e);};
 cv.addEventListener('pointerdown',dn);cv.addEventListener('pointermove',mv);
 const kd=e=>{if(e.key==='ArrowLeft')kl=true;if(e.key==='ArrowRight')kr=true;};const ku=e=>{if(e.key==='ArrowLeft')kl=false;if(e.key==='ArrowRight')kr=false;};
 addEventListener('keydown',kd);addEventListener('keyup',ku);
 function draw(){
  sky(c,WL);seaDraw(c,WL,tt);
  items.forEach(o=>emo(c,o.k==='coin'?'🪙':o.k==='gem'?'💎':'💣',o.x,o.y,o.k==='bomb'?48:44));
  c.save();c.translate(bx,WL+Math.sin(tt*3)*3);if(stun>0&&Math.floor(tt*12)%2===0)c.globalAlpha=.4;
  c.fillStyle='#4a2a12';c.fillRect(-3,-95,6,95);c.fillStyle='#fff';c.beginPath();c.moveTo(3,-92);c.lineTo(60,-25);c.lineTo(3,-20);c.fill();
  c.fillStyle='#c62828';c.font='bold 26px sans-serif';c.textAlign='center';c.fillText('D',24,-40);
  c.fillStyle='#8b5a2b';c.beginPath();c.moveTo(-75,-14);c.lineTo(75,-14);c.lineTo(55,22);c.lineTo(-55,22);c.closePath();c.fill();c.fillStyle='#5a3417';c.fillRect(-75,-16,150,6);
  c.restore();
  fx.forEach(f=>{c.globalAlpha=f.t/.8;c.fillStyle=f.col;c.font='bold 32px sans-serif';c.textAlign='center';c.fillText(f.s,f.x,f.y-(.8-f.t)*60);c.globalAlpha=1;});
 }
 const stopL=loop(dt=>{
  tt+=dt;
  if(!over){time-=dt;sp-=dt;if(sp<=0){const r=Math.random();items.push({x:ri(40,920),y:-30,v:ri(170,240)+L*6+(40-time)*3,k:r<.66?'coin':r<.8?'gem':'bomb'});sp=Math.max(.33,.72-L*.015);}}
  if(kl)tx=bx-200;if(kr)tx=bx+200;
  if(stun>0)stun-=dt;else bx+=(tx-bx)*Math.min(1,dt*10);bx=Math.max(70,Math.min(890,bx));
  for(let i=items.length-1;i>=0;i--){const o=items[i];o.y+=o.v*dt;
   if(o.y>WL-40&&o.y<WL+10&&Math.abs(o.x-bx)<72){items.splice(i,1);
    if(o.k==='coin'){score+=1;sfx.coin();fx.push({x:o.x,y:o.y,t:.8,s:'+1',col:'#b8860b'});}
    else if(o.k==='gem'){score+=3;sfx.ok();fx.push({x:o.x,y:o.y,t:.8,s:'+3',col:'#1565c0'});}
    else{score=Math.max(0,score-2);stun=.8;sfx.boom();fx.push({x:o.x,y:o.y,t:.8,s:'BUM!',col:'#c62828'});}
    hud.score(score);continue;}
   if(o.y>580)items.splice(i,1);}
  for(let i=fx.length-1;i>=0;i--){fx[i].t-=dt;if(fx[i].t<=0)fx.splice(i,1);}
  hud.time(time);
  if(time<=0&&!over){over=true;later(()=>end(score),600);}
  draw();
 });
 return{stop(){stopL();cv.removeEventListener('pointerdown',dn);cv.removeEventListener('pointermove',mv);removeEventListener('keydown',kd);removeEventListener('keyup',ku);},score:()=>score};
};

/* ===================== settings (parent) ===================== */
function modal(html){const m=$('#modal');m.innerHTML='<div class="mbox">'+html+'</div>';m.classList.remove('hidden');}
function closeModal(){$('#modal').classList.add('hidden');}
function parentGate(){
 const a=ri(6,9),b=ri(6,9);
 modal('<h2>👨‍👩‍👦 Dla rodzica</h2><div class="row">Ile to '+a+' × '+b+'?<input id="pg" type="number" inputmode="numeric" style="width:100px"></div><div class="btns"><button class="b sm" id="pc">Anuluj</button><button class="b sm ok" id="po">OK</button></div>');
 $('#pc').onclick=closeModal;
 $('#po').onclick=()=>{if(+$('#pg').value===a*b)settings();else{sfx.bad();closeModal();}};
}
function settings(){
 const s=S.set;const opt=(v,l)=>'<option value="'+v+'"'+(+s.timer===v?' selected':'')+'>'+l+'</option>';
 modal('<h2>⚙️ Ustawienia</h2>'+
 '<div class="row">⏱️ Czas na czytanie<select id="st">'+opt(0,'bez limitu')+opt(3,'3 s')+opt(5,'5 s')+opt(10,'10 s')+opt(15,'15 s')+opt(30,'30 s')+'</select></div>'+
 '<div class="note">Dla zdań czas mnoży się przez liczbę słów; długie słowa dostają ×1,5.</div>'+
 '<div class="row">📖 Ile elementów do czytania<select id="si">'+[6,8,10,12].map(v=>'<option'+(s.items===v?' selected':'')+'>'+v+'</option>').join('')+'</select></div>'+
 '<div class="row">🗣️ Tempo mowy<input id="sr" type="range" min="0.5" max="1.2" step="0.05" value="'+s.rate+'"></div>'+
 '<div class="row">🐢 Po czytaniu mów najpierw sylabami<input id="ss" type="checkbox"'+(s.slow?' checked':'')+' style="width:28px;height:28px"></div>'+
 '<div class="row">🎁 Nagroda<input id="rw" type="text" value="'+esc(s.reward)+'"></div>'+
 '<div class="row">💝 Od kogo<input id="rf" type="text" value="'+esc(s.from)+'"></div>'+
 '<div class="row">Głos: '+(voice?esc(voice.name):'<b>brak polskiego głosu</b>')+'<button class="b sm" id="tv">🔊 Test</button></div>'+
 (!voice?'<div class="warnbox">Na iPadzie: Ustawienia → Dostępność → Treść mówiona → Głosy → Polski. Pobierz głos i odśwież stronę.</div>':'')+
 '<div class="btns" style="margin-top:14px"><button class="b sm" id="ua">🔓 Odblokuj wszystkie wyspy</button><button class="b sm warn" id="rs">🗑️ Zacznij od nowa</button></div>'+
 '<div class="btns" style="margin-top:14px"><button class="b ok" id="sv">Zapisz ✓</button></div>');
 $('#tv').onclick=()=>{S.set.rate=+$('#sr').value;say('Ahoj, Kapitanie Dawidzie! Szczur szuka skarbu.');};
 $('#ua').onclick=()=>{S.lvl=17;save();closeModal();showMap();};
 $('#rs').onclick=()=>{if(confirm('Na pewno zacząć od nowa? Postęp i monety zostaną usunięte.')){const keep=S.set;S=defState();S.set=keep;save();closeModal();titleScreen();}};
 $('#sv').onclick=()=>{s.timer=+$('#st').value;s.items=+$('#si').value;s.rate=+$('#sr').value;s.slow=$('#ss').checked;s.reward=$('#rw').value.trim()||'10 €';s.from=$('#rf').value.trim()||'od mamy i taty';save();closeModal();};
}

/* ===================== boot ===================== */
load();hdr();
$('#hmap').onclick=()=>{ac();showMap();};
$('#hset').onclick=parentGate;
document.addEventListener('gesturestart',e=>e.preventDefault());
titleScreen();
</script>
